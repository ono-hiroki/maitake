apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 同じリモート base を参照
resources:
  - https://github.com/kubernetes-sigs/kustomize//examples/helloWorld?ref=master

# 本番環境用のカスタマイズ
namePrefix: prod-

commonLabels:
  env: production

# レプリカ数を増やす
replicas:
  - name: the-deployment
    count: 5

# イメージタグを変更
images:
  - name: monopole/hello
    newTag: "2"

# パッチでリソースを追加
patches:
  - path: patches/deployment-patch.yaml
